name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Same hooks as local commits: ruff, ty, pytest and the file hygiene checks.
      - name: Run pre-commit
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
